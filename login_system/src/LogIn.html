<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LogIn Page</title>
</head>
<body>
<h1><span>LogIn</span></h1>
<label for="uname"><b>UserName</b></label>
<input type="text" placeholder="Enter Username" name="uname" required  maxlength="50"><br>
<label for="psw"><b>Password</b></label>
<input type="password" placeholder="Enter Password" name="psw" required maxlength="10"><br>
<label for="mnumber"><b>MobileNumber</b></label>
<input type="number" placeholder="Enter MobileNumber" name="mnumber" pattern="^\d{10}$" required size="10" maxlength="10"><br>
<label for="email"><b>Email</b></label>
<input type="text" placeholder="Enter the Email" name="email" required><br>
<label for="DOB"><b>Date of Birth</b></label>
<input type="date" placeholder="Enter Date of birth" name="DOB" required><br>
<label for="Gender"><b>Gender</b></label><br>
<input type="radio" placeholder="Enter The Gender" name="Gender" required value="male">Male<br>
<input type="radio" placeholder="Enter The Gender" name="Gender" required value="Female">Female<br>
<input type="radio" placeholder="Enter The Gender" name="Gender" required value="other">other<br>
<label for="hobbies"><b>Hobbies</b></label><br>
<input type="checkbox" placeholder="Enter the hobbies" name="hobbies" required value="Dancing">Dancing<br>
<input type="checkbox" placeholder="Enter the hobbies" name="hobbies" required value="Listening">Listening<br>
<input type="checkbox" placeholder="Enter the hobbies" name="hobbies" required value="Reading">Reading<br>
<input type="checkbox" placeholder="Enter the hobbies" name="hobbies" required value="Swimming">Swimming<br>
<input type="checkbox" placeholder="Enter the hobbies" name="hobbies" required value="Playing">Playing<br>
<br>
<br>
<button>Submit</button>

</body>
</html>
